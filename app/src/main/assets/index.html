html[data-theme] html,html[data-theme] body{background:var(--bg);color:var(--t)}
html[data-theme] body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--hdr);z-index:60}

html[data-theme] .top b{font-size:17px;white-space:nowrap}

html[data-theme] .svw{margin-left:auto;display:flex;align-items:center;gap:0;font-size:11px;color:var(--hdrs);background:rgba(127,127,127,.16);padding:5px 10px;border-radius:99px;white-space:nowrap}

html[data-theme] .card,html[data-theme] .sec{background:var(--c);border:1px solid var(--b);border-radius:22px;box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--edge);margin:14px 12px 16px}

html[data-theme] .gd,html[data-theme] .stats div,html[data-theme] .z,html[data-theme] .g3 .z{background:var(--c2);border:1px solid var(--b);border-radius:16px;box-shadow:0 2px 0 var(--edge)}

html[data-theme] .stats b{font-family:var(--serif)}
html[data-theme] .sc,html[data-theme] .sc.s0,html[data-theme] .sc.s1,html[data-theme] .sc.s2{background:var(--tint0);border:1px solid var(--b);border-radius:14px;box-shadow:0 3px 0 var(--edge);margin-bottom:3px}

html[data-theme] .sc.s2{background:var(--tint2);box-shadow:0 3px 0 var(--s2)}

html[data-theme] input,html[data-theme] select,html[data-theme] textarea{background:var(--c2);border:1px solid var(--b);color:var(--t)}
html[data-theme] .z input,html[data-theme] .g3 input{background:var(--c)}
html[data-theme] input:focus,html[data-theme] select:focus,html[data-theme] textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
html[data-theme] .btn{box-shadow:0 2px 0 var(--edge)}
html[data-theme] .pri,html[data-theme] .btn.pri,html[data-theme] .sub .on,html[data-theme] .seg .on,html[data-theme] .view .on{background:var(--acc);color:var(--on);border:0;box-shadow:0 3px 0 var(--accd)}
html[data-theme] .ok{background:var(--s2)!important;color:var(--onok)!important;border:0!important;box-shadow:0 3px 0 rgba(0,0,0,.28)!important}
html[data-theme] .del,html[data-theme] .x{background:none;color:var(--bad);box-shadow:none}
html[data-theme] .del{border-color:var(--bad)}
html[data-theme] .pill,html[data-theme] .zb{background:var(--acc);color:var(--on);border:0}

html[data-theme] .chip{background:var(--c2);border:1px solid var(--b)}
html[data-theme] .sub button,html[data-theme] .sub2 button{background:var(--c);border:1px solid var(--b);box-shadow:0 3px 0 var(--edge);border-radius:18px;color:var(--t)}
html[data-theme] .sub .on{background:var(--acc);color:var(--on);box-shadow:0 3px 0 var(--accd)}
html[data-theme] .sub u{background:var(--s2)}
html[data-theme] .sub2{background:var(--bg);top:var(--sat);padding:10px 12px 12px}
html[data-theme] .sub2 button{box-shadow:0 3px 0 var(--ac,var(--edge))}

html[data-theme] .sub2 button span{color:var(--ac,var(--acc))}
html[data-theme] .sub2 .on,html[data-theme] .sub2 button.on{background:var(--ac,var(--acc));color:var(--onc,#fff);border-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.3)}

html[data-theme] .view{background:var(--c2);border:1px solid var(--b);box-shadow:none;border-radius:18px}
html[data-theme] .view .on{box-shadow:0 2px 0 var(--accd)}
html[data-theme] .sb,html[data-theme] .hb{background:var(--c2)}
html[data-theme] .hero{background:var(--hero);color:var(--herot);border:1px solid var(--b);box-shadow:0 4px 0 var(--edge);border-radius:26px}
html[data-theme] .hero b{color:var(--heroa)}
html[data-theme] .hero small{color:var(--herot)}
html[data-theme] .trow{background:var(--c);border:1px solid var(--b);box-shadow:0 3px 0 var(--edge);border-radius:20px}
html[data-theme] .ck{border-color:var(--m);background:var(--c2)}
html[data-theme] .ck.on{background:var(--s2);border-color:var(--s2);box-shadow:0 3px 0 rgba(0,0,0,.25)}
html[data-theme] .ck svg{stroke:var(--onok)}
html[data-theme] .tg{background:var(--c2);border:1px solid var(--b)}
html[data-theme] nav{left:12px;right:12px;bottom:calc(10px + var(--sab));max-width:536px;padding:6px;background:var(--nav);border:1px solid var(--b);border-radius:30px;backdrop-filter:none;box-shadow:0 4px 0 var(--edge),0 14px 26px -10px var(--shd)}
html[data-theme] nav button{color:var(--navt);background:none;border:0;border-radius:22px;font-size:11px;font-weight:600;letter-spacing:.2px}
html[data-theme] nav button span{display:inline-flex;padding:5px 18px;border-radius:99px;margin:0 0 3px;transition:background .2s,transform .2s}
html[data-theme] nav .on{color:var(--navon);font-weight:700}
html[data-theme] nav .on span{background:var(--navbub);transform:translateY(-1px)}
html[data-theme] nav .on::after{display:none}
html[data-theme] #t{background:var(--t);color:var(--bg);border-radius:16px;bottom:calc(98px + var(--sab));box-shadow:0 8px 24px var(--shd)}
html[data-theme] #t u{color:var(--acc2)}
html[data-theme] .thg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
html[data-theme] .thb{padding:8px;text-align:left;border-radius:18px;border:2px solid var(--b);background:var(--c2);box-shadow:0 3px 0 var(--edge);color:var(--t)}
html[data-theme] .thb.on{border-color:var(--acc);box-shadow:0 3px 0 var(--acc)}
html[data-theme] .thp{height:58px;border-radius:12px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(127,127,127,.25)}
html[data-theme] .thp i{display:block;height:8px;border-radius:5px}
html[data-theme] .thb b{display:block;margin-top:9px;font-size:14px}
html[data-theme] .thb small{color:var(--m);font-size:11px}
html[data-theme] .bch{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
html[data-theme] .bch button{flex:none;padding:8px 14px;border-radius:16px;font-weight:700;white-space:nowrap;background:var(--c);border:1px solid var(--b);box-shadow:0 3px 0 var(--edge);color:var(--t);line-height:1.15}
html[data-theme] .bch small{display:block;font-size:10px;font-weight:500;color:var(--m)}
html[data-theme] .bch .on{background:var(--acc);color:var(--on);box-shadow:0 3px 0 var(--accd)}
html[data-theme] .bch .on small{color:inherit;opacity:.8}
html[data-theme] .pstick{position:sticky;top:var(--sat);z-index:6;background:var(--bg);padding:10px 12px 8px}
html[data-theme] .sumr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
html[data-theme] .ring{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--s2) calc(var(--p)*1%),var(--b) 0);display:grid;place-items:center;flex:none}
html[data-theme] .ring b{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px}
html[data-theme] .sn{flex:1;text-align:center}
html[data-theme] .sn b{font-family:var(--serif);font-size:20px;display:block;line-height:1}
html[data-theme] .sn small{font-size:10px;color:var(--m)}
html[data-theme] .tbar{display:flex;gap:8px;align-items:center}
html[data-theme] .tbar .view{flex:1;margin:0}
html[data-theme] .tbar .btn{padding:11px 14px}
html[data-theme] .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 12px 0}
html[data-theme] .grid.g1{grid-template-columns:1fr}
html[data-theme] .bt2{border-radius:22px;padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.3);min-width:0;cursor:pointer}
html[data-theme] .th{display:flex;justify-content:space-between;align-items:center;gap:6px}
html[data-theme] .th b{font-family:var(--serif);font-size:18px}
html[data-theme] .tm{font-size:12px;opacity:.85;margin:2px 0 6px}
html[data-theme] .tr{display:grid;grid-template-columns:auto auto 1fr;gap:6px 8px;align-items:center;padding:8px;margin-top:6px;border-radius:14px;background:rgba(255,255,255,.17)}
html[data-theme] .bt2.lt .tr{background:rgba(0,0,0,.08)}
html[data-theme] .tz{font-weight:800;font-size:12px;background:rgba(0,0,0,.4);color:#fff;border-radius:8px;padding:2px 8px}
html[data-theme] .tr>b{font-size:15px}
html[data-theme] .sg{display:flex;gap:3px}
html[data-theme] .sg i{flex:1;height:7px;border-radius:3px;background:rgba(127,127,127,.5);box-shadow:0 0 0 1px rgba(0,0,0,.18)}

html[data-theme] .sg .s2{background:#2fd18b}
html[data-theme] .tn{grid-column:1/-1;font-size:11px;font-weight:700;background:rgba(0,0,0,.38);color:#fff;border-radius:99px;padding:5px 10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme] .bt2 .btn{background:rgba(0,0,0,.32);color:#fff;border:0;box-shadow:none;flex:1}
html[data-theme] .gt{margin:18px 14px 0}

html[data-theme] #sheet .pn{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88%;overflow:auto;background:var(--c);border-radius:28px 28px 0 0;padding:16px 16px calc(18px + var(--sab));box-shadow:0 -4px 0 var(--edge);animation:up .22s ease}

html[data-theme] .sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
html[data-theme] .sh-h b{flex:1;font-family:var(--serif);font-size:20px}
html[data-theme] .sw2{width:26px;height:26px;border-radius:50%;border:2px solid var(--b);flex:none}
html[data-theme] .x2{padding:6px 12px;border-radius:99px}
html[data-theme] .pk{color:var(--t);font:inherit}
html[data-theme] .pk.sel{outline:2px solid var(--acc);outline-offset:1px}
html[data-theme] .dots{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
html[data-theme] .dt{width:44px;height:44px;border-radius:50%;border:2px solid var(--b);padding:0}

html[data-theme] .gl{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--b);border-radius:14px;margin-top:8px;background:var(--c2)}

grp.map(([v,t])=>{const rows=all.filter(r=>r.g.st[k].s==v);return rows.length?`<div class=gt>${t} (${rows.length})</div>`+rows.map(r=>`<div class=card style="margin:8px 12px;padding:12px"><div class=gh2>${sw(r.it.w)}<b style="font-size:17px">${esc(r.it.w)}</b>${jt(r.it)}<span class=zb>${r.g.z}</span><b class=pcs>${r.g.q||0} pcs</b></div>${stepCtl(r.it.id,r.i,k,r.g)}</div>`).join(''):''}).join('')}

<div class=card><b>＋ Tambah rencana ${jn}</b><div class=row><select onchange="pw=this.value">${ws.map(k=>`<option ${k==pw?'selected':''}>${k}</option>`).join('')}</select></div><div class=zr>${SZ.map(s=>`<button class="zc ${pz.includes(s)?'on':''}" onclick="tz('${s}')">${s}</button>`).join('')}</div><div class=row><button class="btn pri" style="flex:1" onclick="ap()">＋ Tambah ke rencana</button></div></div>`}

<script>
/* =====================================================================
   NATIVE APK · TAMBAHAN (script ke-2)
   color wheel · transisi tab slide · splash tunggal · statusbar paksa tema
   ===================================================================== */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function hex2rgb(x){x=String(x).trim().replace('#','');if(x.length==3)x=[...x].map(c=>c+c).join('');const n=parseInt(x,16)||0;return[n>>16&255,n>>8&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
const normHex=x=>rgb2hex(...hex2rgb(x));
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
function hsl2hex(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,1);l=clamp(l,0,1);const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgb2hex(f(0)*255,f(8)*255,f(4)*255)}
function hsv2hex(h,s,v){const l=v*(1-s/2),sl=(l==0||l==1)?0:(v-l)/Math.min(l,1-l);return hsl2hex(h,sl,l)}
function hex2hsv(hex){const[r,g,b]=hex2rgb(hex).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx==r)h=((g-b)/d)%6;else if(mx==g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
function hex2hsl(hex){const[r,g,b]=hex2rgb(hex).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;let h=0;if(d){if(mx==r)h=((g-b)/d)%6;else if(mx==g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}const s=d?d/(1-Math.abs(2*l-1)):0;return[h,s,l]}
function lumHex(hex){const[r,g,b]=hex2rgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
const onColor=hex=>lumHex(hex)>.179?'#101010':'#ffffff';

/* ---------- palet otomatis dari satu warna (color wheel) ---------- */
function palette(c){
  const dark=c.mode!=='light',h=c.h,sat=c.s;
  let acc=hsv2hex(h,sat,c.v);const[ah,as,al]=hex2hsl(acc);
  if(dark){if(al<.58)acc=hsl2hex(ah,as,.58)}else{if(al>.42)acc=hsl2hex(ah,as,.42)}
  const P={acc,accd:mix(acc,'#000000',dark?.35:.3),acc2:mix(acc,'#ffffff',dark?.4:.45),on:onColor(acc)};
  if(dark){
    const ss=.10+.30*sat;
    Object.assign(P,{bg:hsl2hex(h,ss,.075),c:hsl2hex(h,ss,.115),c2:hsl2hex(h,ss,.155),b:hsl2hex(h,ss,.23),edge:hsl2hex(h,ss,.04),
      t:hsl2hex(h,.2,.92),m:hsl2hex(h,.12,.66),hdr:hsl2hex(h,ss,.095),hdrt:hsl2hex(h,.25,.95),hdrs:hsl2hex(h,.14,.72),
      s0:hsl2hex(h,.08,.52),s1:'#dcb560',s2:'#5fcf93',bad:'#ef7b72',hi:'rgba(255,255,255,.06)',shd:'rgba(0,0,0,.5)',onok:'#06180f'});
    P.hero=mix(hsl2hex(h,ss+.05,.2),acc,.18);P.herot=P.t;P.heroa=P.acc2;
    P.nav=P.c;P.navt=P.m;P.navon=P.acc2;P.navbub=mix(P.c2,acc,.22);
    P.tint0=P.c2;P.tint1=mix(P.c2,'#dcb560',.28);P.tint2=mix(P.c2,'#5fcf93',.28);
  }else{
    const ss=.25+.45*sat;
    Object.assign(P,{bg:hsl2hex(h,ss,.95),c:hsl2hex(h,ss,.99),c2:hsl2hex(h,ss,.92),b:hsl2hex(h,ss*.8,.84),edge:hsl2hex(h,ss*.5,.74),
      t:hsl2hex(h,.4,.14),m:hsl2hex(h,.16,.40),s0:hsl2hex(h,.1,.60),s1:'#c97a1c',s2:'#2f8a58',bad:'#c1403a',hi:'rgba(255,255,255,.85)',onok:'#ffffff'});
    P.hdr=acc;P.hdrt=P.on;P.hdrs=mix(acc,P.on,.7);
    P.hero=mix(acc,'#000000',.12);P.herot=onColor(P.hero);P.heroa=P.herot;
    P.nav=P.c;P.navt=P.m;P.navon=P.accd;P.navbub=mix(P.c2,acc,.18);
    const[ar,ag,ab]=hex2rgb(P.accd);P.shd=`rgba(${ar},${ag},${ab},.22)`;
    P.tint0=P.c2;P.tint1=mix(P.c2,'#e8a45a',.35);P.tint2=mix(P.c2,'#4fa57a',.3);
  }
  return P}
const PK=['bg','c','c2','t','m','b','edge','hi','shd','acc','accd','on','acc2','hdr','hdrt','hdrs','hero','herot','heroa','nav','navt','navon','navbub','s0','s1','s2','bad','tint0','tint1','tint2','onok'];
function customCss(P,c){return`html[data-theme=custom]{color-scheme:${c.mode==='light'?'light':'dark'};${PK.map(k=>`--${k}:${P[k]}`).join(';')};--p:var(--acc);--pt:var(--on);--gd:var(--acc);--gold:var(--acc);--gold2:var(--acc2);--ink:var(--acc);--glow:transparent}`}
function getCth(){
  if(!S.cfg.cth){const cs=getComputedStyle(document.documentElement);let a=(cs.getPropertyValue('--acc')||'').trim();if(!/^#[0-9a-f]{3,6}$/i.test(a))a='#1ecfb6';
    const[h,s,v]=hex2hsv(a);S.cfg.cth={h,s,v,mode:cs.colorScheme==='light'?'light':'dark'}}
  return S.cfg.cth}

/* ---------- statusbar & navigation bar Android: dipaksa ikut tema ---------- */
function pushBars(){try{
  if(!AB||!AB.setBars)return;
  const cs=getComputedStyle(document.documentElement),hd=cs.getPropertyValue('--hdr').trim(),bg=cs.getPropertyValue('--bg').trim();
  if(!/^#[0-9a-f]{3,6}$/i.test(hd)||!/^#[0-9a-f]{3,6}$/i.test(bg))return;
  const sp=document.getElementById('sp'),nv=(sp&&!sp.classList.contains('out'))?hd:bg;
  AB.setBars(normHex(hd),lumHex(hd)>.4,normHex(nv),lumHex(nv)>.4)}catch(e){}}
function applyTheme(id){
  id=LEG[id]||id;if(id!=='custom'&&!TH.find(x=>x[0]==id))id='sequoia';
  if(id==='custom'){const c=getCth(),css=customCss(palette(c),c);let el=document.getElementById('cth');
    if(!el){el=document.createElement('style');el.id='cth';document.head.appendChild(el)}el.textContent=css;try{localStorage.stokCth=css}catch(e){}}
  document.documentElement.dataset.theme=id;try{localStorage.stokTheme=id}catch(e){}
  pushBars()}
function setTheme(id){S.cfg.theme=id;applyTheme(id);save();R();const t=TH.find(x=>x[0]==id);T('Tema: '+(id=='custom'?'Kustom':t[1]))}

/* ---------- komponen COLOR WHEEL (dipakai tema & warna bahan) ---------- */
const WH={};
function whInit(st){return{...st}}
function whHexOf(st){return hsv2hex(st.h,st.s,st.v)}
function whHTML(id,st){
  WH[id]=st;const hex=whHexOf(st),a=st.h*Math.PI/180,r=st.s*50;
  return`<div class=whw>
<div class=wh id="wh-${id}" onpointerdown="whDown(event,'${id}')" onpointermove="whMove(event,'${id}')" onpointerup="whUp(event,'${id}')" onpointercancel="whUp(event,'${id}')"><i class=whd id="whd-${id}" style="opacity:${1-st.v}"></i><i class=whm id="whm-${id}" style="left:${50+r*Math.sin(a)}%;top:${50-r*Math.cos(a)}%;background:${hex}"></i></div>
<div class=whr><small>Gelap</small><input type=range data-k=1 min=12 max=100 id="whv-${id}" value="${Math.round(st.v*100)}" style="--wt:linear-gradient(90deg,#000,${hsv2hex(st.h,st.s,1)})" oninput="whV('${id}',this.value)" onchange="whEnd('${id}')"><small>Terang</small></div>
<div class=whh><span class=whp id="whp-${id}" style="background:${hex}"></span><input data-k=1 id="whx-${id}" value="${hex.toUpperCase()}" maxlength=7 autocomplete=off onchange="whHexIn('${id}',this.value)"></div></div>`}
function whPaint(id){const st=WH[id],w=document.getElementById('wh-'+id);if(!st||!w)return;
  const a=st.h*Math.PI/180,r=st.s*50,hex=whHexOf(st),m=document.getElementById('whm-'+id);
  m.style.left=(50+r*Math.sin(a))+'%';m.style.top=(50-r*Math.cos(a))+'%';m.style.background=hex;
  document.getElementById('whd-'+id).style.opacity=1-st.v;
  const v=document.getElementById('whv-'+id);v.value=Math.round(st.v*100);v.style.setProperty('--wt','linear-gradient(90deg,#000,'+hsv2hex(st.h,st.s,1)+')');
  document.getElementById('whp-'+id).style.background=hex;
  const x=document.getElementById('whx-'+id);if(document.activeElement!==x)x.value=hex.toUpperCase()}
function whChanged(id){const st=WH[id];whPaint(id);if(st.raf)return;st.raf=requestAnimationFrame(()=>{st.raf=0;st.on&&st.on(whHexOf(st),st)})}
function whPick(e,id){const st=WH[id],w=document.getElementById('wh-'+id);if(!st||!w)return;
  const r=w.getBoundingClientRect(),R0=r.width/2,dx=e.clientX-r.left-R0,dy=e.clientY-r.top-R0;
  st.h=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;st.s=Math.min(1,Math.hypot(dx,dy)/R0);whChanged(id)}
function whDown(e,id){e.preventDefault();const st=WH[id];if(!st)return;st.drag=true;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(x){}whPick(e,id)}
function whMove(e,id){const st=WH[id];if(st&&st.drag){e.preventDefault();whPick(e,id)}}
function whUp(e,id){const st=WH[id];if(!st||!st.drag)return;st.drag=false;st.end&&st.end(whHexOf(st),st)}
function whV(id,val){const st=WH[id];st.v=clamp(val/100,.12,1);whChanged(id)}
function whEnd(id){const st=WH[id];st&&st.end&&st.end(whHexOf(st),st)}
function whHexIn(id,val){let x=String(val).trim();if(x[0]!='#')x='#'+x;
  if(!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(x)){T('Kode warna tidak valid');const t=document.getElementById('whx-'+id);if(t)t.value=whHexOf(WH[id]).toUpperCase();return}
  const[h,s,v]=hex2hsv(x),st=WH[id];st.h=h;st.s=s;st.v=Math.max(.12,v);whChanged(id);whEnd(id)}

/* ---------- tema kustom (color wheel) ---------- */
function thLive(hex,st){const c=getCth();c.h=st.h;c.s=st.s;c.v=st.v;S.cfg.theme='custom';applyTheme('custom')}
function thEnd(){S.cfg.theme='custom';applyTheme('custom');save();R()}
function thMode(m){const c=getCth();c.mode=m;S.cfg.theme='custom';applyTheme('custom');save();R()}
function vTheme(){
  const cur=document.documentElement.dataset.theme,c=getCth(),P=palette(c);
  const tile=`<button class="thb ${cur=='custom'?'on':''}" onclick="setTheme('custom')"><div class=thp style="background:${P.bg}"><i style="width:55%;background:${P.hdr}"></i><i style="width:85%;background:${P.c}"></i><i style="width:32%;background:${P.acc}"></i></div><b>Kustom${cur=='custom'?' ✓':''}</b><small>${c.mode=='light'?'Terang':'Gelap'} · color wheel</small><div class=pdots>${[P.bg,P.c,P.hdr,P.acc,P.acc2].map(x=>`<i style="background:${x}"></i>`).join('')}</div></button>`;
  const pre=TH.map(([id,nm,cl,lt,p])=>`<button class="thb ${id==cur?'on':''}" onclick="setTheme('${id}')"><div class=thp style="background:${cl[0]}"><i style="width:55%;background:${cl[3]}"></i><i style="width:85%;background:${cl[1]}"></i><i style="width:32%;background:${cl[2]}"></i></div><b>${nm}${id==cur?' ✓':''}</b><small>${lt?'Terang':'Gelap'}</small><div class=pdots>${p.map(x=>`<i style="background:${x}"></i>`).join('')}</div></button>`).join('');
  return`<div class=card><div class=m style="margin-top:2px"><b>Warna tema · color wheel</b><br>Geser pada roda untuk memilih warna utama. Tampilan aplikasi dan warna statusbar HP langsung ikut berubah.</div>
<div class=cmode style="margin-top:10px"><button class="${c.mode!='light'?'on':''}" onclick="thMode('dark')">🌙 Gelap</button><button class="${c.mode=='light'?'on':''}" onclick="thMode('light')">☀️ Terang</button></div>
${whHTML('th',{h:c.h,s:c.s,v:c.v,on:thLive,end:thEnd})}
<div class=m style="margin:16px 2px 0">Atau pilih tema siap pakai:</div><div class=thg>${tile}${pre}</div></div>`}

/* ---------- modal color wheel untuk warna bahan ---------- */
const WM={cb:null};
function wmOpen(title,hex,cb){

  el.innerHTML=`<div class=bk onclick="wmClose()"></div><div class=pn><div class=sh-h><b>${title}</b><button class="btn x2" onclick="wmClose()">Batal</button></div>${whHTML('wm',{h,s,v:Math.max(.12,v)})}<div class=row style="margin-top:14px"><button class="btn pri big" onclick="wmSave()">Simpan warna</button></div></div>`;

function wmClose(){const el=document.getElementById('wm');WM.cb=null;if(!el.classList.contains('on')||el.classList.contains('lv'))return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.classList.remove('on');el.innerHTML='';return}
 el.classList.add('lv');clearTimeout(wmClose.t);wmClose.t=setTimeout(()=>{el.classList.remove('on','lv');el.innerHTML=''},190)}

/* ---------- transisi antar tab · v10 "fade-through + geser" ----------
   keluar 110ms (accelerate) -> render -> masuk 260ms (decelerate).
   Tidak ada cloneNode; hanya 1 layer (#app) yang dianimasikan lewat transform+opacity. */
let _tg=0,_tA=[];
function goTab(k,y0){
  if(!(k in TABS))return;
  const keys=Object.keys(TABS),from=keys.indexOf(tab),to=keys.indexOf(k),app=document.getElementById('app'),
        RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(from===to){dz=null;R();scrollTo({top:0,behavior:RM?'auto':'smooth'});return}
  const busy=_tA.length>0,gen=++_tg;
  _tA.forEach(a=>{try{a.cancel()}catch(e){}});_tA=[];
  const swap=()=>{tab=k;dz=null;R();scrollTo(0,y0||0)};
  if(RM){swap();return}
  const dir=to>from?1:-1,root=document.documentElement,EO='cubic-bezier(.05,.7,.1,1)',EI='cubic-bezier(.3,0,.8,.15)';
  /* highlight nav langsung saat disentuh */
  [...document.getElementById('nav').children].forEach((b,i)=>b.classList.toggle('on',keys[i]==k));
  root.classList.add('tsl');app.style.willChange='transform,opacity';app.style.pointerEvents='none';
  const fin=()=>{if(gen!==_tg)return;_tA=[];app.style.willChange='';app.style.pointerEvents='';root.classList.remove('tsl')};
  const enter=()=>{const a=app.animate([{opacity:0,transform:`translate3d(${dir*32}px,0,0)`},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:260,easing:EO});_tA=[a];a.onfinish=fin};
  setTimeout(()=>{if(gen===_tg){app.style.willChange='';app.style.pointerEvents='';root.classList.remove('tsl')}},800);
  if(busy){swap();enter();return}
  const o=app.animate([{opacity:1,transform:'translate3d(0,0,0)'},{opacity:0,transform:`translate3d(${-dir*20}px,0,0)`}],{duration:110,easing:EI,fill:'forwards'});
  _tA=[o];o.onfinish=()=>{if(gen!==_tg)return;swap();o.cancel();enter()}}

  _exitAt=n;T('Tekan sekali lagi untuk keluar');return 1}catch(e){}return 0};

{const sp=document.getElementById('sp');if(sp)sp.remove();pushBars();
 try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('app').animate([{opacity:0,transform:'translate3d(0,10px,0)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.05,.7,.1,1)'})}catch(e){}}
